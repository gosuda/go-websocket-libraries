name: Benchmark WebSocket Libraries

on:
  schedule:
    - cron: '40 2 * * 1'
  workflow_dispatch:

concurrency:
  group: benchmark-publisher
  cancel-in-progress: false

permissions: {}

jobs:
  benchmark:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install dependencies and update libraries
        run: |
          go mod download
          go get -u ./...
          go mod tidy

      - name: Run Benchmark
        run: go run ./benchmark/...
        # The benchmark main.go will fetch latest versions and save results to benchmark_history.json

      - name: Generate Performance Graph
        run: go run ./cmd/generate_graph
        # Assumes cmd/generate_graph/main.go reads benchmark_history.json and outputs benchmark_performance.png

      - name: Update README Table
        run: go run ./cmd/update_readme
        # Assumes cmd/update_readme/main.go reads benchmark_history.json and updates README.md
      
      - name: Update results
        run: |
          mkdir -p results
          cp benchmark/benchmark_history.json results/
          cp benchmark_performance.png results/
          cp go.mod results/
          cp go.sum results/
          cp README.md results/

      - name: Upload build artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: results/*
          name: results.zip

      - name: Generate workflow provenance
        id: provenance
        uses: actions/attest-build-provenance/predicate@1176ef556905f349f669722abf30bce1a6e16e01 # predicate@1.1.5

      - name: Add the measured source revision
        id: measured-source
        env:
          PREDICATE: ${{ steps.provenance.outputs.predicate }}
        run: |
          source_sha=$(git rev-parse HEAD)
          predicate=$(jq -c \
            --arg source "git+https://github.com/$GITHUB_REPOSITORY@refs/heads/main" \
            --arg sha "$source_sha" \
            '.buildDefinition.resolvedDependencies += [{uri: $source, digest: {gitCommit: $sha}}]' \
            <<< "$PREDICATE")
          printf 'predicate=%s\n' "$predicate" >> "$GITHUB_OUTPUT"

      - name: Attest the results and measured source
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-name: results.zip
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
          predicate-type: ${{ steps.provenance.outputs.predicate-type }}
          predicate: ${{ steps.measured-source.outputs.predicate }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: Update benchmark results, graph, and README"
          file_pattern: "README.md benchmark/benchmark_history.json benchmark_performance.png go.mod go.sum" # Updated graph filename
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

